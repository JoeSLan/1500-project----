# Plantilla de Streamlit Secrets.
#  - Streamlit Cloud: copia el contenido a tu app → Settings → Secrets.
#  - Local: copia este archivo a .streamlit/secrets.toml (está en .gitignore; NUNCA lo subas a GitHub).

ANTHROPIC_API_KEY = "sk-ant-..."

[supabase]
url = "https://TU-PROYECTO.supabase.co"        # Supabase → Project Settings → API → Project URL
key = "sb_secret_..."                          # service_role / secret key (NO la anon/publishable)
# table = "users"                              # opcional; default "users"

[saas]
support_email = "soporte@tudominio.mx"
# Días de prueba gratis al registrarse. Sin definir = 3 días.
#   signup_days = 7    → prueba gratis de 7 días
#   signup_days = -1   → sin acceso hasta pagar (ve los planes al registrarse)
# signup_days = 7

# Precio y Payment Link de cada plan. Si no defines "url" se usan los links de PRUEBA de Stripe:
#   mensual   https://buy.stripe.com/test_eVqeV6c159ns20n3jSgA800
#   anual     https://buy.stripe.com/test_14A00c5CHbvA6gDcUsgA801
#   vitalicio https://buy.stripe.com/test_28EfZafdhczEeN9f2AgA802
# La app agrega sola ?prefilled_email=...&client_reference_id=... para acreditar el pago a la cuenta.
# Al pasar a producción reemplaza cada url por el link en vivo (sin "test_").
[saas.plans.mensual]
price = "$499 MXN"      # ← EJEMPLO: escribe el precio real de tu Payment Link
url = "https://buy.stripe.com/test_eVqeV6c159ns20n3jSgA800"

[saas.plans.anual]
price = "$4,990 MXN"    # ← EJEMPLO
url = "https://buy.stripe.com/test_14A00c5CHbvA6gDcUsgA801"

[saas.plans.vitalicio]
price = "$12,990 MXN"   # ← EJEMPLO
url = "https://buy.stripe.com/test_28EfZafdhczEeN9f2AgA802"

[stripe]
# Clave SECRETA (sk_test_... en pruebas, sk_live_... en producción). Stripe → Developers → API keys.
# La app la usa para confirmar el pago cuando el cliente regresa de Stripe (?session_id=...).
# El secreto del webhook (whsec_...) NO va aquí: va en Supabase → Edge Functions → Secrets.
secret_key = "sk_test_..."
# Opcional: identificar el plan por precio en lugar de por Payment Link.
# price_plans = { "price_1Abc..." = "mensual", "price_1Def..." = "anual", "price_1Ghi..." = "vitalicio" }

# Respaldo opcional: cuentas fijas (admin, demos) que funcionan aunque Supabase falle.
# Genera el bloque con:  python manage_users.py export-toml
# [[users]]
# email = "admin@tudominio.mx"
# password_hash = "pbkdf2_sha256$600000$...$..."
# plan_type = "vitalicio"
# is_active = true
# is_lifetime = true
